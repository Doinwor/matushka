<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080a">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Матушка — национальный музыкальный плеер. Моя волна, артисты и их треки.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Матушка">
  <meta name="format-detection" content="telephone=no">
  <title>Матушка — русская музыка</title>

  <link rel="icon" href="img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/icon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=20261105">
</head>
<body>
  <a class="skip-link" href="#view">Перейти к содержимому</a>

  <div class="ambient" aria-hidden="true">
    <span class="ambient__glow ambient__glow--red"></span>
    <span class="ambient__glow ambient__glow--blue"></span>
    <span class="ambient__grain"></span>
  </div>

  <header class="topbar">
    <div class="topbar__inner">
      <a class="brand" href="#/" aria-label="Матушка — на главную">
        <span class="brand__mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </span>
        <span class="brand__text">
          <span class="brand__word">Матушка</span>
          <span class="brand__sub">русская музыка</span>
        </span>
      </a>

      <button class="wave-pill" id="top-wave" type="button" title="Моя волна"
              aria-label="Включить мою волну" aria-pressed="false">
        <span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>
        <span class="wave-pill__text">Моя волна</span>
      </button>
    </div>
  </header>

  <div class="page">
    <main class="view" id="view" tabindex="-1">
      <div class="skeleton" aria-hidden="true">
        <div class="skeleton__hero"></div>
        <div class="skeleton__line"></div>
        <div class="skeleton__grid">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
    </main>

    <footer class="footer">
      <span class="footer__flag" aria-hidden="true"></span>
      <p>Матушка · русская музыка · 2026</p>
    </footer>
  </div>

  <nav class="dock" aria-label="Основная навигация">
    <div class="dock__inner">
      <a class="dock__item" href="#/" data-dock="home">
        <span class="dock__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M4 10.6 12 4l8 6.6V19a2 2 0 0 1-2 2h-3.6v-6.2H9.6V21H6a2 2 0 0 1-2-2v-8.4Z"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="dock__label">Главная</span>
      </a>

      <a class="dock__item" href="#/search" data-dock="search">
        <span class="dock__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="m20 20-3.6-3.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <span class="dock__label">Поиск</span>
      </a>

      <button class="dock__wave" id="dock-wave" type="button"
              aria-label="Включить мою волну" aria-pressed="false">
        <span class="dock__orb" aria-hidden="true">
          <span class="eq"><span></span><span></span><span></span></span>
        </span>
        <span class="dock__label">Волна</span>
      </button>

      <a class="dock__item" href="#/favorites" data-dock="favorites">
        <span class="dock__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M12 20.2s-7.5-4.6-7.5-9.8A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.5 3c0 5.2-7.5 9.8-7.5 9.8Z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="dock__label">Избранное</span>
        <span class="dock__badge" id="dock-fav-count" hidden>0</span>
      </a>
    </div>
  </nav>

  <div class="player" id="player" hidden>
    <div class="player__backdrop" aria-hidden="true"></div>

    <div class="player__panel">
      <button class="player__close" id="player-close" type="button" aria-label="Свернуть плеер">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button class="player__art" id="player-art" type="button"
              aria-label="Открыть плеер" aria-expanded="false">
        <span class="player__art-letter" id="player-art-letter">М</span>
        <img class="player__art-img" id="player-art-img" alt="" decoding="async" hidden>
      </button>

      <div class="player__meta">
        <div class="player__title" id="player-title">—</div>
        <div class="player__artist" id="player-artist">—</div>
      </div>

      <div class="player__controls">
        <button class="icon-btn" id="prev" type="button" aria-label="Предыдущий трек">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 5v14M20 5.5v13a1 1 0 0 1-1.55.83L9 13.83a1 1 0 0 1 0-1.66l9.45-5.5A1 1 0 0 1 20 5.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="icon-btn icon-btn--play" id="toggle" type="button" aria-label="Играть">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5v13a1 1 0 0 0 1.53.85l10-6.5a1 1 0 0 0 0-1.7l-10-6.5A1 1 0 0 0 8 5.5Z" fill="currentColor"/>
          </svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M7 5h3.2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm6.8 0H17a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-3.2a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z" fill="currentColor"/>
          </svg>
        </button>

        <button class="icon-btn" id="next" type="button" aria-label="Следующий трек">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 5v14M4 5.5v13a1 1 0 0 0 1.55.83L15 13.83a1 1 0 0 0 0-1.66L5.55 4.67A1 1 0 0 0 4 5.5Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="icon-btn player__extra" id="player-fav" type="button"
                aria-pressed="false" aria-label="В избранное">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20.2s-7.5-4.6-7.5-9.8A4.4 4.4 0 0 1 12 7.4a4.4 4.4 0 0 1 7.5 3c0 5.2-7.5 9.8-7.5 9.8Z"
                  fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="icon-btn player__extra" id="queue-btn" type="button"
                aria-expanded="false" aria-controls="queue" aria-label="Очередь">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h10" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="player__timeline">
        <span class="player__time" id="time-current">0:00</span>
        <div class="player__seek">
          <input type="range" id="seek" min="0" max="1000" step="1" value="0"
                 aria-label="Позиция трека">
        </div>
        <span class="player__time" id="time-total">0:00</span>
      </div>

      <div class="player__volume">
        <button class="player__mute" id="mute" type="button" aria-label="Выключить звук" aria-pressed="false">
          <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor"/>
            <path d="M15.5 8.6a5 5 0 0 1 0 6.8M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="i-mute" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor"/>
            <path d="m16 9 5 6M21 9l-5 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <input class="player__volume-range" id="volume" type="range"
               min="0" max="1" step="0.01" value="1" aria-label="Громкость">
      </div>

      <div class="player__tools">
        <button class="player__tool" id="sleep-btn" type="button"
                aria-haspopup="dialog" aria-controls="sleep" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 14.2A8.2 8.2 0 0 1 9.8 4a8.4 8.4 0 1 0 10.2 10.2Z"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="sleep-label">Таймер сна</span>
        </button>

        <button class="player__tool" id="share-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15V4m0 0L8.5 7.5M12 4l3.5 3.5M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"
                  fill="none" stroke="currentColor" stroke-width="1.8"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>Поделиться</span>
        </button>
      </div>
    </div>
  </div>

  <div class="queue" id="queue" hidden aria-label="Очередь треков">
    <div class="queue__head">
      <div class="queue__heading">
        <strong>Далее</strong>
        <span class="queue__mode" id="queue-mode">Моя волна</span>
      </div>
      <button class="queue__close" id="queue-close" type="button" aria-label="Закрыть очередь">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <ol class="queue__list" id="queue-list"></ol>
  </div>

  <div class="sheet" id="sleep" hidden>
    <div class="sheet__panel" role="dialog" aria-modal="true" aria-labelledby="sleep-title">
      <div class="sheet__head">
        <h2 class="sheet__title" id="sleep-title">Таймер сна</h2>
        <button class="sheet__close" id="sleep-close" type="button" aria-label="Закрыть таймер сна">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <p class="sheet__text">Музыка выключится сама — можно спокойно засыпать.</p>

      <div class="sheet__options" id="sleep-options">
        <button class="sheet__option" type="button" data-sleep="0">Выкл</button>
        <button class="sheet__option" type="button" data-sleep="15">15 минут</button>
        <button class="sheet__option" type="button" data-sleep="30">30 минут</button>
        <button class="sheet__option" type="button" data-sleep="45">45 минут</button>
        <button class="sheet__option" type="button" data-sleep="60">1 час</button>
        <button class="sheet__option" type="button" data-sleep="90">1,5 часа</button>
      </div>

      <p class="sheet__status" id="sleep-status" hidden></p>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="sr-only" id="live" role="status" aria-live="polite"></div>

  <noscript>
    <div class="noscript">Для прослушивания музыки включите JavaScript в браузере.</div>
  </noscript>

  <script type="module" src="js/app.js?v=20261105"></script>
</body>
</html>
